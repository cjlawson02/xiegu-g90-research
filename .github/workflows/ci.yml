name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - name: Install package and test deps
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v
      - name: Publish scrub (public gate)
        run: python3 scripts/publish_scrub_check.py --publish
